<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Billing</title>
  </head>
  <body>
    <h1>Smart Billing</h1>
    <label for="quantity">Enter Quantity:</label>
    <input type="number" id="quantity" placeholder="Enter quantity" />
    <button id="calculateBtn">Calculate Bill</button>
    <p id="output"></p>
    <label for="marks">Enter your marks:</label>
    <input type="number" id="marks" placeholder="Enter marks (0-100)" />
    <button id="gradeBtn">Check Grade</button>
    <p id="gradeOutput"></p>
    <script src="script.js"></script>
  </body>
</html>
